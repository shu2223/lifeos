<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="lifeos-version" content="{VERSION}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:,">
<title>生活记录</title>
<link rel="stylesheet" href="static/style.css?v={VERSION}">
<script src="static/app.js?v={VERSION}" defer></script>
</head>
<body>
<header class="ys-topbar">
  <div class="ys-topbar-inner">
    <a class="ys-back" id="homeLink" href="/"><svg class="ys-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 4 7.5 12l8 8"/></svg>主页</a>
    <h1 class="ys-page-title">生活记录</h1>
    <p class="ys-page-meta" id="subtitle">正在读取…</p>
    <div class="ys-header-actions ys-header-actions--nav">
      <button id="addButton" class="ys-btn ys-btn--primary ys-btn--sm ys-btn--capsule" type="button"><svg class="ys-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>记一笔</button>
    </div>
  </div>
</header>

<main class="ys-page page">
  <nav id="tabs" class="ys-seg tabs" aria-label="页面">
    <a href="#/today" data-view="today">今天</a>
    <a href="#/records" data-view="records">记录</a>
    <a href="#/trends" data-view="trends">趋势</a>
    <a href="#/foods" data-view="foods">食物</a>
    <a href="#/settings" data-view="settings">设置</a>
  </nav>

  <div id="issues" class="issues" role="status" hidden></div>

  <div id="bootSkeleton" class="boot-skeleton" aria-hidden="true">
    <div class="ys-card">
      <ul class="ys-skeleton">
        <li class="ys-skeleton-row"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-text"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-bar"></span></span><span class="ys-skeleton-bar"></span></li>
        <li class="ys-skeleton-row"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-text"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-bar"></span></span><span class="ys-skeleton-bar"></span></li>
      </ul>
    </div>
    <div class="ys-card">
      <ul class="ys-skeleton">
        <li class="ys-skeleton-row"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-text"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-bar"></span></span><span class="ys-skeleton-bar"></span></li>
        <li class="ys-skeleton-row"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-text"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-bar"></span></span><span class="ys-skeleton-bar"></span></li>
        <li class="ys-skeleton-row"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-text"><span class="ys-skeleton-bar"></span><span class="ys-skeleton-bar"></span></span><span class="ys-skeleton-bar"></span></li>
      </ul>
    </div>
  </div>

  <div id="view" class="view" aria-live="polite"></div>
</main>

<dialog id="recordDialog" class="ys-dialog ys-dialog--wide" aria-labelledby="recordTitle" tabindex="-1" autofocus>
  <div class="ys-dialog-head">
    <div class="ys-dialog-heading"><h2 class="ys-dialog-title" id="recordTitle"></h2><p id="recordMeta" class="ys-dialog-sub"></p></div>
    <button class="ys-btn ys-btn--icon ys-btn--quiet close-dialog" type="button" aria-label="关闭"><svg class="ys-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  </div>
  <div id="recordBody" class="ys-dialog-body record-body"></div>
</dialog>

<dialog id="addDialog" class="ys-dialog" aria-labelledby="addTitle" tabindex="-1" autofocus>
  <form id="addForm">
    <div class="ys-dialog-head">
      <div class="ys-dialog-heading"><h2 class="ys-dialog-title" id="addTitle">记一笔</h2><p class="ys-dialog-sub">平时让 agent 记录更省事，这里用来手动补一条。</p></div>
      <button class="ys-btn ys-btn--icon ys-btn--quiet close-dialog" type="button" aria-label="关闭"><svg class="ys-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="ys-dialog-body form-body">
      <div id="addKinds" class="ys-seg ys-seg--fill" role="tablist" aria-label="记录类型"></div>
      <div id="addFields" class="ys-form-grid"></div>
      <p id="addError" class="form-error" role="alert" hidden></p>
    </div>
    <div class="ys-dialog-foot"><button class="ys-btn ys-btn--primary" type="submit">保存</button></div>
  </form>
</dialog>

<dialog id="foodDialog" class="ys-dialog" aria-labelledby="foodTitle" tabindex="-1" autofocus>
  <form id="foodForm">
    <div class="ys-dialog-head">
      <div class="ys-dialog-heading"><h2 class="ys-dialog-title" id="foodTitle">食物</h2><p class="ys-dialog-sub">agent 记录同样的食物时会直接用这里的营养数据。</p></div>
      <button class="ys-btn ys-btn--icon ys-btn--quiet close-dialog" type="button" aria-label="关闭"><svg class="ys-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="ys-dialog-body form-body">
      <div id="foodFields" class="ys-form-grid"></div>
      <p id="foodError" class="form-error" role="alert" hidden></p>
    </div>
    <div class="ys-dialog-foot">
      <button id="foodDelete" class="ys-btn ys-btn--danger ys-dialog-foot-start" type="button">删除</button>
      <button class="ys-btn ys-btn--primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<dialog id="tokenDialog" class="ys-dialog" aria-labelledby="tokenTitle" tabindex="-1" autofocus>
  <div class="ys-dialog-head">
    <div class="ys-dialog-heading"><h2 class="ys-dialog-title" id="tokenTitle">新的 token</h2><p class="ys-dialog-sub">只显示这一次。关闭后无法再查看，丢了就吊销重发。</p></div>
    <button class="ys-btn ys-btn--icon ys-btn--quiet close-dialog" type="button" aria-label="关闭"><svg class="ys-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
  </div>
  <div id="tokenBody" class="ys-dialog-body token-body"></div>
</dialog>

<div id="toast" class="ys-toast" role="status" hidden></div>
</body>
</html>
